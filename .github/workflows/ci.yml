name: CI

# Formatter, linter, validator and tests (mocked AWS, no credentials). Every
# check runs even if an earlier one fails, so one run shows all problems, and
# the job fails if any of them fail.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call: # run by release.yml before tagging

permissions:
  contents: read

jobs:
  check:
    name: Format, lint, validate and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Same version as local development: .terraform-version (read by tfenv).
      - id: tf-version
        run: echo "version=$(cat .terraform-version)" >> "$GITHUB_OUTPUT"
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ steps.tf-version.outputs.version }}
          terraform_wrapper: false

      - uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: v0.65.0

      # Formats in place, then fails if that changed anything.
      - name: Format
        if: ${{ !cancelled() }}
        run: |
          terraform fmt -recursive
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::terraform fmt changed files. Run 'terraform fmt -recursive' (or 'pre-commit run --all-files') and commit the result."
            git status --short
            git diff
            exit 1
          fi

      # Regenerates each module's README tables, then fails if that changed anything.
      - name: Docs
        if: ${{ !cancelled() }}
        env:
          TERRAFORM_DOCS_VERSION: v0.24.0
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$RUNNER_TEMP"
          gh release download "$TERRAFORM_DOCS_VERSION" -R terraform-docs/terraform-docs \
            -p "terraform-docs-$TERRAFORM_DOCS_VERSION-linux-amd64.tar.gz" -p "terraform-docs-$TERRAFORM_DOCS_VERSION.sha256sum"
          grep linux-amd64.tar.gz "terraform-docs-$TERRAFORM_DOCS_VERSION.sha256sum" | sha256sum -c
          tar xzf "terraform-docs-$TERRAFORM_DOCS_VERSION-linux-amd64.tar.gz" terraform-docs
          cd "$GITHUB_WORKSPACE"
          for m in */; do
            [ -f "$m/versions.tf" ] && "$RUNNER_TEMP/terraform-docs" "$m"
          done
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Module READMEs are out of date. Run 'pre-commit run --all-files' and commit the result."
            git diff
            exit 1
          fi

      # --recursive only looks for .tflint.hcl in each module's own directory,
      # so point every module at the shared root config.
      - name: Lint
        if: ${{ !cancelled() }}
        env:
          GITHUB_TOKEN: ${{ github.token }} # avoids rate limits downloading the aws plugin
        run: |
          tflint --init
          tflint --recursive --config "$GITHUB_WORKSPACE/.tflint.hcl" --format compact

      # Validated through each module's examples/: static-website needs an
      # aliased provider, which only a root configuration can pass it.
      - name: Validate
        if: ${{ !cancelled() }}
        run: |
          status=0
          for d in */examples/*/; do
            echo "::group::$d"
            terraform -chdir="$d" init -backend=false -input=false && terraform -chdir="$d" validate || status=1
            echo "::endgroup::"
          done
          exit $status

      - name: Test
        if: ${{ !cancelled() }}
        run: |
          status=0
          for m in */; do
            [ -d "$m/tests" ] || continue
            echo "::group::$m"
            terraform -chdir="$m" init -backend=false -input=false && terraform -chdir="$m" test || status=1
            echo "::endgroup::"
          done
          exit $status
