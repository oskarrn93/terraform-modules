name: CI

# Formatter, docs, linter, validator and tests (mocked AWS, no credentials).
# Every check runs even if an earlier one fails, so one run shows all
# problems, and the job fails if any of them fail.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: # also used by tool-versions.yml to check its update PRs
  workflow_call: # run by release.yml before tagging

permissions:
  contents: read

jobs:
  check:
    name: Format, lint, validate and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Tool versions come from .tool-versions, the same file local setups use.
      - id: versions
        run: |
          while read -r tool version; do
            echo "$tool=$version" >> "$GITHUB_OUTPUT"
          done < .tool-versions

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ steps.versions.outputs.terraform }}
          terraform_wrapper: false

      - uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: v${{ steps.versions.outputs.tflint }}

      - name: Install terraform-docs
        env:
          VERSION: v${{ steps.versions.outputs.terraform-docs }}
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$RUNNER_TEMP"
          gh release download "$VERSION" -R terraform-docs/terraform-docs \
            -p "terraform-docs-$VERSION-linux-amd64.tar.gz" -p "terraform-docs-$VERSION.sha256sum"
          grep linux-amd64.tar.gz "terraform-docs-$VERSION.sha256sum" | sha256sum -c
          tar xzf "terraform-docs-$VERSION-linux-amd64.tar.gz" terraform-docs
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - uses: actions/setup-node@v7
        with:
          node-version: lts/* # only runs the CloudFront Function tests (node:test, no dependencies)

      - name: Tool versions
        run: scripts/check-tool-versions.sh

      # Formats in place, then fails if that changed anything.
      - name: Format
        if: ${{ !cancelled() }}
        run: |
          terraform fmt -recursive
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::terraform fmt changed files. Run 'pre-commit run --all-files' and commit the result."
            git status --short
            git diff
            exit 1
          fi

      # Regenerates each module's README tables, then fails if that changed anything.
      - name: Docs
        if: ${{ !cancelled() }}
        run: |
          for m in */; do
            [ -f "$m/versions.tf" ] || continue
            terraform-docs "$m"
          done
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Module READMEs are out of date. Run 'pre-commit run --all-files' and commit the result."
            git diff
            exit 1
          fi

      # --recursive only looks for .tflint.hcl in each module's own directory,
      # so point every module at the shared root config.
      - name: Lint
        if: ${{ !cancelled() }}
        env:
          GITHUB_TOKEN: ${{ github.token }} # avoids rate limits downloading the aws plugin
        run: |
          tflint --init
          tflint --recursive --config "$GITHUB_WORKSPACE/.tflint.hcl" --format compact

      # Validated through each module's examples/: static-website needs an
      # aliased provider, which only a root configuration can pass it.
      - name: Validate
        if: ${{ !cancelled() }}
        run: |
          status=0
          for d in */examples/*/; do
            echo "::group::$d"
            terraform -chdir="$d" init -backend=false -input=false && terraform -chdir="$d" validate || status=1
            echo "::endgroup::"
          done
          exit $status

      - name: Test
        if: ${{ !cancelled() }}
        run: |
          status=0
          for m in */; do
            [ -d "$m/tests" ] || continue
            echo "::group::$m"
            terraform -chdir="$m" init -backend=false -input=false && terraform -chdir="$m" test || status=1
            echo "::endgroup::"
          done
          exit $status

      - name: Test CloudFront Functions
        if: ${{ !cancelled() }}
        run: node --test
