name: Release

# Releases the whole repo: Actions → Release → Run workflow, pick the SemVer
# bump. Runs CI on the commit first, then creates the vX.Y.Z tag and a GitHub
# release listing the commits that touched modules/ since the previous
# release. The first release is v1.0.0. All modules share the version.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "SemVer bump (see README: major = consumers must change code or resources get replaced)"
        type: choice
        options:
          - patch
          - minor
          - major

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    name: Tag and release
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      BUMP: ${{ inputs.bump }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tags and history for the version and the notes

      - name: Only release from main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Releases are cut from main, not ${GITHUB_REF}"
          exit 1

      - name: Work out the version and notes
        id: version
        run: |
          prev=$(git tag --list 'v[0-9]*' --sort=-v:refname | head -n 1)

          if [ -z "$prev" ]; then
            next="1.0.0"
            range="HEAD"
          else
            if git diff --quiet "$prev" HEAD -- modules; then
              echo "::error::No changes to modules/ since $prev, nothing to release"
              exit 1
            fi
            IFS=. read -r major minor patch <<< "${prev#v}"
            case "$BUMP" in
              major) next="$((major + 1)).0.0" ;;
              minor) next="$major.$((minor + 1)).0" ;;
              patch) next="$major.$minor.$((patch + 1))" ;;
            esac
            range="$prev..HEAD"
          fi

          tag="v$next"
          {
            echo "## Changes"
            echo
            for m in modules/*/; do
              m=${m%/}
              log=$(git log --no-merges --format='- %s (%h)' "$range" -- "$m")
              [ -n "$log" ] || continue
              echo "### ${m#modules/}"
              echo
              echo "$log"
              echo
            done
            echo "## Usage"
            echo
            echo '```hcl'
            for m in modules/*/; do
              m=${m%/}
              echo "source = \"git::https://github.com/${GITHUB_REPOSITORY}.git//$m?ref=$tag\""
            done
            echo '```'
            if [ -n "$prev" ]; then
              echo
              echo "**Full diff:** https://github.com/${GITHUB_REPOSITORY}/compare/${prev}...${tag}"
            fi
          } > "$RUNNER_TEMP/notes.md"

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Releasing $tag (previous: ${prev:-none})"
          cat "$RUNNER_TEMP/notes.md"

      - name: Create tag and release
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
